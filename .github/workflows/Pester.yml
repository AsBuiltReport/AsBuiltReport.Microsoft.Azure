name: Pester Tests

on:
  push:
    branches:
      - main
      - dev
      - master
  pull_request:
    branches:
      - main
      - dev
      - master
  workflow_dispatch:

jobs:
  test:
    name: Pester Tests - ${{ matrix.os }} - ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        shell: [pwsh]
        include:
          - os: windows-latest
            shell: powershell
        exclude:
          - os: ubuntu-latest
            shell: powershell
          - os: macos-latest
            shell: powershell

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PowerShell Gallery
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install PowerShell modules
        run: |
          # Retry each install, as downloads from the PowerShell Gallery can fail intermittently
          $Modules = @(
            @{ Name = 'Pester'; MinimumVersion = '5.0.0' }
            @{ Name = 'PScribo'; MinimumVersion = '0.11.1' }
            @{ Name = 'PSScriptAnalyzer'; MinimumVersion = '1.0.0' }
            @{ Name = 'AsBuiltReport.Core'; MinimumVersion = '1.6.4' }
            @{ Name = 'AsBuiltReport.Diagram'; MinimumVersion = '1.0.8' }
          )
          $MaxAttempts = 3

          foreach ($Module in $Modules) {
            for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
              try {
                Install-Module -Name $Module.Name -MinimumVersion $Module.MinimumVersion -Repository PSGallery -Force -AllowClobber -Scope CurrentUser -ErrorAction Stop
                break
              } catch {
                if ($Attempt -eq $MaxAttempts) { throw }
                $WaitSeconds = 30 * $Attempt
                Write-Warning "Attempt $Attempt of $MaxAttempts to install $($Module.Name) failed, retrying in $WaitSeconds seconds: $($_.Exception.Message)"
                Start-Sleep -Seconds $WaitSeconds
              }
            }
          }

      - name: Run Pester Tests
        run: |
          $CodeCoverageParam = @{}
          $OutputFormatParam = @{ OutputFormat = 'NUnitXml' }

          # Only enable code coverage for Windows + pwsh
          if ('${{ matrix.os }}' -eq 'windows-latest' -and '${{ matrix.shell }}' -eq 'pwsh') {
            $CodeCoverageParam = @{ CodeCoverage = $true }
          }

          .\Tests\Invoke-Tests.ps1 @CodeCoverageParam @OutputFormatParam

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: Tests/testResults.xml
          retention-days: 30

      - name: Upload code coverage to Codecov
        if: matrix.os == 'windows-latest' && matrix.shell == 'pwsh'
        uses: codecov/codecov-action@v5
        with:
          files: ./Tests/coverage.xml
          flags: unit
          name: codecov-${{ matrix.os }}-${{ matrix.shell }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
